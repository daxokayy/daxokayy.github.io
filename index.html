<script>
const button = document.getElementById('copy');
const loader = document.getElementById('loader');
const status = document.getElementById('status');
let reset;
button.addEventListener('click', async () => {
  clearTimeout(reset);
  try {
    await navigator.clipboard.writeText(loader.textContent);
    button.textContent = 'COPIED';
    status.textContent = 'Script copied to clipboard.';
    reset = setTimeout(() => { button.textContent = 'COPY SCRIPT'; status.textContent = ''; }, 2500);
  } catch {
    const range = document.createRange();
    range.selectNodeContents(loader);
    const selection = window.getSelection();
    selection.removeAllRanges();
    selection.addRange(range);
    status.textContent = 'Copy unavailable. Script selected—press Ctrl+C or long-press to copy.';
  }
});
document.getElementById('year').textContent = new Date().getFullYear();
