<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Get the Daxware loader.">
<title>daxware</title>
<link rel="icon" type="image/png" href="dw.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
<div class="mark"><img src="dw.png" alt="DW" width="226" height="100"></div>
<h1>daxware</h1>
<section class="script-panel" aria-label="Daxware loader">
<code id="loader">loadstring(game:HttpGet("https://daxware.site"))()</code>
<button id="copy" type="button">COPY SCRIPT</button>
<p id="status" role="status" aria-live="polite"></p>
</section>
<a class="discord" href="https://discord.gg/vRj7eCtPad" target="_blank" rel="noopener noreferrer">JOIN DISCORD <span aria-hidden="true">↗</span></a>
</main>
<footer>© <span id="year">2026</span> DAXWARE</footer>
<script>
const button = document.getElementById('copy');
const loader = document.getElementById('loader');
const status = document.getElementById('status');
let reset;
button.addEventListener('click', async () => {
  clearTimeout(reset);
  try {
    await navigator.clipboard.writeText(loader.textContent);
    button.textContent = 'COPIED';
    status.textContent = 'Script copied to clipboard.';
    reset = setTimeout(() => { button.textContent = 'COPY SCRIPT'; status.textContent = ''; }, 2500);
  } catch {
    const range = document.createRange();
    range.selectNodeContents(loader);
    const selection = window.getSelection();
    selection.removeAllRanges();
    selection.addRange(range);
    status.textContent = 'Copy unavailable. Script selected—press Ctrl+C or long-press to copy.';
  }
});
document.getElementById('year').textContent = new Date().getFullYear();
</script>
</body>
</html>
